name: Build Windows EXE

on:
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Verify application entry point
        shell: pwsh
        run: |
          python -c "from flutter_project_maker.main import main; print('Entry point imported successfully:', main)"

      - name: Create executable launcher
        shell: pwsh
        run: |
          @'
          from flutter_project_maker.main import main

          if __name__ == "__main__":
              main()
          '@ | Set-Content -Encoding utf8 build_exe.py

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name FlutterProjectMaker build_exe.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse
          if (!(Test-Path "dist/FlutterProjectMaker.exe")) {
            throw "Executable was not created. Check the PyInstaller build log."
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: FlutterProjectMaker-Windows
          path: dist/FlutterProjectMaker.exe
          if-no-files-found: error
          retention-days: 14
