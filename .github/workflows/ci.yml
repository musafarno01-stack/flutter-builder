
name: Python CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Format Python files
        run: ruff format .

      - name: Check Python formatting
        run: ruff format --check .

      - name: Check lint
        run: ruff check .

      - name: Run automated tests
        run: pytest -v

      - name: Verify application package
        run: python -c "import flutter_project_maker; print(flutter_project_maker.__version__)"

      - name: Upload pytest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: .pytest_cache/
          if-no-files-found: ignore
